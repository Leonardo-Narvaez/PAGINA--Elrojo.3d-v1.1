<!doctype html>
<html lang="es">
  <head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELROJO.3D - Recuperar contraseña</title>
  </head>
  <body>
    <div class="page">
      <div class="brand-panel">
        <div class="brand-content">
          <img src="images/logo.png" alt="Elrojo.3d" class="logo-box" />
          <div class="logo">@Elrojo.3d</div>
          <div class="subtitle">Impresión 3D</div>
          <p class="brand-text">
            Te enviaremos un enlace a tu correo para que puedas crear una contraseña nueva.
          </p>
        </div>
      </div>

      <div class="form-panel">
        <div class="phone">
          <img src="images/logo.png" alt="Elrojo.3d" class="logo-box mobile-only" />
          <div class="logo mobile-only">@Elrojo.3d</div>
          <div class="subtitle mobile-only">Impresión 3D</div>

          <div class="welcome">Recuperar contraseña</div>
          <div class="description">
            Ingresa el correo electrónico con el que inicias sesión y te enviaremos un enlace para restablecer tu contraseña.
          </div>

          <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" id="recuperarEmail" placeholder="correo@elrojo3d.com" required />
          </div>

          <button class="login-btn" onclick="enviarCorreoRecuperacion()">Enviar enlace</button>

          <div class="footer">
            <a href="index.html" class="back-to-login">← Volver a iniciar sesión</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/recuperar-password.js"></script>
  </body>
</html>
