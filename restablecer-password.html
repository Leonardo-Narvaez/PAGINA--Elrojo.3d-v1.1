<!doctype html>
<html lang="es">
  <head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELROJO.3D - Nueva contraseña</title>
  </head>
  <body>
    <div class="page">
      <div class="brand-panel">
        <div class="brand-content">
          <img src="images/logo.png" alt="Elrojo.3d" class="logo-box" />
          <div class="logo">@Elrojo.3d</div>
          <div class="subtitle">Impresión 3D</div>
          <p class="brand-text">Crea una contraseña nueva para volver a entrar a tu panel.</p>
        </div>
      </div>

      <div class="form-panel">
        <div class="phone">
          <img src="images/logo.png" alt="Elrojo.3d" class="logo-box mobile-only" />
          <div class="logo mobile-only">@Elrojo.3d</div>
          <div class="subtitle mobile-only">Impresión 3D</div>

          <div class="welcome">Nueva contraseña</div>
          <div class="description" id="restablecerDescripcion">
            Escribe tu nueva contraseña dos veces para confirmarla.
          </div>

          <div class="input-group">
            <label>Contraseña nueva</label>
            <input type="password" id="passwordNueva" placeholder="••••••••" required />
          </div>

          <div class="input-group">
            <label>Confirmar contraseña</label>
            <input type="password" id="passwordConfirmar" placeholder="••••••••" required />
          </div>

          <button class="login-btn" id="btnGuardarPassword" onclick="guardarPasswordNueva()">
            Guardar contraseña
          </button>

          <div class="footer">
            <a href="index.html" class="back-to-login">← Volver a iniciar sesión</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/restablecer-password.js"></script>
  </body>
</html>
