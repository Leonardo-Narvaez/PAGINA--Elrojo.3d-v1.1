<!doctype html>
<html lang="es">
  <head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELROJO.3D - Pedidos</title>
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img src="images/logo.png" alt="Elrojo.3d" class="logo-box" />
          <div>
            <div class="logo">@Elrojo.3d</div>
            <div class="subtitle">Impresión 3D</div>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>Inicio</a>
          <a href="inventario.html" class="nav-item"><span class="nav-icon">📦</span>Inventario</a>
          <a href="produccion.html" class="nav-item active"><span class="nav-icon">🖨️</span>Producción</a>
          <a href="ventas.html" class="nav-item"><span class="nav-icon">🧾</span>Ventas</a>
        </nav>

        <div class="sidebar-user">
          <div class="user-menu-wrapper">
            <button class="user-menu-btn" onclick="toggleNotifications(this)">
              <span class="user-avatar">👤</span>
              <span class="user-info">
                <span class="user-name"></span>
                <span class="user-role">Ver cuenta</span>
              </span>
              <span class="user-caret">⌄</span>
            </button>
            <div class="user-menu">
              <a href="#" class="user-menu-item danger" onclick="cerrarSesionSupabase(); return false;">🚪 Cerrar sesión</a>
            </div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="top">
          <div class="top-brand mobile-only">
            <img src="images/logo.png" alt="Elrojo.3d" class="top-logo" />
            <div>
              <div class="logo">@Elrojo.3d</div>
              <div class="subtitle">Pedidos</div>
            </div>
          </div>

          <div class="top-actions">
            <div class="user-menu-wrapper">
              <button class="icon-btn" aria-label="Perfil" onclick="toggleNotifications(this)">👤</button>
              <div class="user-menu">
                <a href="#" class="user-menu-item danger" onclick="cerrarSesionSupabase(); return false;">🚪 Cerrar sesión</a>
              </div>
            </div>
          </div>
        </div>

        <a href="dashboard.html" class="back-link desktop-only">← Volver a Inicio</a>
        <h1 class="page-title">Pedidos</h1>
        <div class="description-left">Trazabilidad de cada pedido, de principio a fin.</div>

        <div class="filtros-pedidos">
          <div class="input-group">
            <label class="filter-group-label">Estado del pedido</label>
            <select id="filtroEstado">
              <option value="todos">Todos</option>
              <option value="Pendiente">Pendiente</option>
              <option value="Confirmado">Confirmado</option>
              <option value="En producción">En producción</option>
              <option value="Listo">Listo</option>
              <option value="Entregado">Entregado</option>
            </select>
          </div>
          <div class="input-group">
            <label class="filter-group-label">Estado de pago</label>
            <select id="filtroPago">
              <option value="todos">Todos</option>
              <option value="Pendiente">Pendiente</option>
              <option value="Parcial">Parcial</option>
              <option value="Pagado">Pagado</option>
            </select>
          </div>
        </div>

        <div class="pedidos-list" id="listaPedidos"></div>
      </main>
    </div>

    <button class="floating" aria-label="Agregar" onclick="window.location.href='nueva-venta.html'">+</button>

    <div class="modal-overlay" id="modalDescuentoFilamento">
      <div class="modal-box">
        <div class="modal-header">
          <h3>Registrar entrega</h3>
          <button type="button" class="modal-close" onclick="cerrarModalDescuentoFilamento()">✕</button>
        </div>
        <p id="modalDescuentoInfo" class="modal-info" style="margin-bottom: 12px"></p>
        <form id="formDescuentoFilamento">
          <div class="input-group">
            <label>Filamento consumido</label>
            <select id="descuentoFilamento" required></select>
          </div>
          <div class="input-group">
            <label>Gramos utilizados</label>
            <input type="number" id="descuentoGramos" min="1" placeholder="Ej. 120" required />
          </div>
          <div class="form-actions">
            <button type="button" class="action" onclick="cerrarModalDescuentoFilamento()">Cancelar</button>
            <button type="submit" class="action primary">Confirmar entrega</button>
          </div>
        </form>
      </div>
    </div>

    <div class="bottom-nav mobile-only">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span>Inicio</a>
      <a href="inventario.html" class="nav-item"><span class="nav-icon">📦</span>Inventario</a>
      <a href="produccion.html" class="nav-item active"><span class="nav-icon">🖨️</span>Producción</a>
      <a href="ventas.html" class="nav-item"><span class="nav-icon">🧾</span>Ventas</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pedidos.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async () => {

    const autorizado = await verificarSesion();

    if (!autorizado) {
        return;
    }

    await verificarRol(["Ventas", "Producción"]);

});

</script>

  </body>
</html>
